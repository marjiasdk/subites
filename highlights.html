<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Your Highlights</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 24px;
      }
      .highlight-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 14px;
        background: #fafafa;
      }
      .highlight-text {
        font-size: 15px;
        background: #ffe08a;
        padding: 2px 4px;
        border-radius: 3px;
        line-height: 1.5;
      }
      .highlight-note {
        font-size: 13px;
        color: #555;
        margin-top: 8px;
        font-style: italic;
      }
      .highlight-meta {
        font-size: 12px;
        color: #999;
        margin-top: 10px;
      }
      .highlight-meta a {
        color: #ff6719;
        text-decoration: none;
      }
      .empty-state {
        font-size: 14px;
        color: #999;
        text-align: center;
        padding: 60px 0;
      }
      .delete-btn {
        float: right;
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Your Highlights</h1>
    <div id="highlights-container"></div>
    <script src="highlights.js"></script>
  </body>
</html>
