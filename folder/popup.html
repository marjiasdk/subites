<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 350px;
        max-height: 500px;
        overflow-y: auto;
        font-family: -apple-system, sans-serif;
        padding: 12px;
        margin: 0;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px 0;
      }
      .highlight-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        background: #fafafa;
      }
      .highlight-text {
        font-size: 13px;
        background: #ffe08a;
        padding: 2px 4px;
        border-radius: 3px;
        display: inline;
      }
      .highlight-note {
        font-size: 12px;
        color: #555;
        margin-top: 6px;
        font-style: italic;
      }
      .highlight-meta {
        font-size: 11px;
        color: #999;
        margin-top: 6px;
      }
      .highlight-meta a {
        color: #ff6719;
        text-decoration: none;
      }
      .empty-state {
        font-size: 13px;
        color: #999;
        text-align: center;
        padding: 20px 0;
      }
      .delete-btn {
        float: right;
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Your Highlights</h2>
    <div id="highlights-container"></div>
    <script src="popup.js"></script>
  </body>
</html>
